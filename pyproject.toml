[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-mitosis-confinement-mechanics"
version = "2.0.0"
description = "Reproducible analytical theory for spindle-nuclear-envelope mechanics and transmitted confinement during closed mitosis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]


[tool.setuptools.packages.find]
where = ["src"]

